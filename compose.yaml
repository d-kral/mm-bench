name: mm-benchcat

services:
  neo4j:
    container_name: mm-benchcat-neo4j
    image: neo4j:latest
    volumes:
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/config:/config
      - ./data/neo4j/data:/data
      - ./data/neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=none
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
