name: mm-benchcat

services:
  mongodb:
    container_name: mm-benchcat-mongodb
    image: mongo:latest
    environment:
      # fixes the mongo 8.0 and Linux kernel 6.19 compatibility bug
      # https://forums.docker.com/t/docker-compose-mongo-exit-code-139/151353/9
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - ./data/mongodb:/data:Z

  mongo-express:
    container_name: mm-benchcat-mongo-express
    image: mongo-express
    environment:
      - ME_CONFIG_MONGODB_SERVER=mm-benchcat-mongodb
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"

  neo4j:
    container_name: mm-benchcat-neo4j
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=none
    ports:
      - "${NEO4J_BOLT_PORT}:7687"
      - "${NEO4J_HTTP_PORT}:7474"
    volumes:
      - ./data/neo4j/logs:/logs:Z
      - ./data/neo4j/data:/data:Z

  postgresql:
    container_name: mm-benchcat-postgresql
    image: postgres:latest
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "${POSTGRESQL_PORT}:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql:Z

  pgadmin:
    container_name: mm-benchcat-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=postgres
      - PGADMIN_CONFIG_SERVER_MODE=false
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=false
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
    ports:
      - "${PGADMIN_PORT}:80"

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "MM-benchcat PostgreSQL",
            "Group": "Servers",
            "Host": "postgresql",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "Password": "postgres",
            "SSLMode": "prefer"
          }
        }
      }
